; PlatformIO Configuration for ESP32 Bio-Telemetry Firmware v5.0
; ==============================================================
; Direct I2C firmware — zero external sensor libraries required.
;
; Usage:
;   1. Install PlatformIO (https://platformio.org/install)
;   2. Open this project folder in VS Code with PlatformIO extension
;   3. Build and upload: pio run --target upload
;
; The firmware uses only Arduino.h and Wire.h (built-in).
; No Adafruit, SparkFun, or other sensor libraries needed.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
